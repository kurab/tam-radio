<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- CSP: the inline style and script are allowed by hash; re-hash after editing them. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-BrSTDyGubHmEf1uN2B2Id+6tjBj7FFs+ofNs+NvtoJM='; style-src 'sha256-JJK6ii6OK0l4SN5sPGLLEGT11pgP53KjdKvW35n5nVA='; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ページが見つかりません｜Tám Radio</title>
<meta name="theme-color" content="#0c0e14">
<style>
/* Tám Radio 404 page. Colours and fonts follow the player (index.html :root). */
:root{--yellow:#ffd028;--cam:#161a26;--text:#f2f3f7;--muted:#8d93a8;--line:rgba(255,255,255,.13);
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
html,body{height:100%}
body{margin:0;background:#07080c;color:var(--text);font-family:var(--jp);display:grid;place-items:center;padding:16px;box-sizing:border-box}
main{width:100%;max-width:560px;background:var(--cam);border:1px solid var(--line);border-radius:16px;padding:12px 28px 40px;text-align:center;box-sizing:border-box;overflow:hidden}
.pic{display:block;width:calc(100% + 56px);max-width:none;height:auto;aspect-ratio:3/2;margin:0 -28px 4px}  /* Tám on her scooter (ninja-lead-left); transparent PNG source, served as WebP */
.code{font:800 14px/1 "SF Mono",Menlo,Consolas,monospace;letter-spacing:3px;color:var(--muted);margin:0 0 10px}
h1{font-size:clamp(17px,5vw,22px);margin:0 0 12px;word-break:keep-all}
p{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 24px}
a.home{display:inline-block;background:var(--yellow);color:#0c0e14;font-weight:800;text-decoration:none;border-radius:999px;padding:12px 28px}
a.home:hover{filter:brightness(1.08)}
.copy{margin:24px 0 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <img class="pic" id="pic" src="" alt="スクーターに乗った Tám Radio のキャラクター" width="960" height="640">
  <p class="code">404 NOT FOUND</p>
  <h1>ページが見つかりませんでした</h1>
  <p>アドレスが間違っているか、公開が終わったページです。<br>Tám Radio は、最新の回から聞けます。</p>
  <a class="home" id="home" href="/">最新の回を聞く</a>
  <p class="copy"><small>© 2026 kurab</small></p>
</main>
<script>
// GitHub Pages serves this page for every missing path. On a project site (user.github.io/<repo>/...) the site's top is
// the first path segment, so the link and the picture are made absolute from there; elsewhere the top is "/".
(function () {
  var seg = location.pathname.split("/")[1];
  var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  document.getElementById("home").href = base;
  document.getElementById("pic").src = base + "ninja-lead-left.webp";
})();
</script>
</body>
</html>
